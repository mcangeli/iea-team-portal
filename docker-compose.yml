name: ${COMPOSE_PROJECT_NAME:-iea-team-portal}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${PORTAL_ENV_FILE:-../.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - ${PORTAL_ENV_FILE:-../.env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-iea-team-portal_postgres_data}
  media_data:
    name: ${MEDIA_VOLUME_NAME:-iea-team-portal_media_data}
