{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>Page not found · Team Portal</title>
  <script>(function(){try{const saved=localStorage.getItem('iea-theme');const preferred=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=(saved==='dark'||saved==='light')?saved:preferred}catch(e){document.documentElement.dataset.theme='light'}})();</script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/theme-v2.css' %}">
  <link rel="stylesheet" href="{% static 'css/polish-v2.css' %}">
</head>
<body class="error-shell">
  <main class="error-page container">
    <section class="error-card card">
      <div class="error-card-topline"><div class="eyebrow">TEAM PORTAL · 404</div><button class="theme-toggle error-theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark theme"><span aria-hidden="true">◐</span><span class="theme-toggle-label">Theme</span></button></div>
      <div class="error-code" aria-hidden="true">404</div>
      <h1>That page isn’t here.</h1>
      <p class="muted">The link may be outdated, the record may have moved, or the page may no longer exist.</p>
      <div class="actions error-actions"><a class="btn" href="/">Return to Dashboard</a><button class="btn secondary" type="button" onclick="history.back()">Go Back</button></div>
      <p class="muted error-caption">Page not found</p>
    </section>
  </main>
<script>(function(){const b=document.getElementById('theme-toggle');if(!b)return;function t(){return document.documentElement.dataset.theme||'light'}function s(){const d=t()==='dark';b.setAttribute('aria-pressed',d?'true':'false');b.querySelector('.theme-toggle-label').textContent=d?'Light':'Dark';const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#101719':'#f5f7f5')}b.addEventListener('click',function(){const n=t()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('iea-theme',n)}catch(e){}s()});s()})();</script>
</body></html>
