{% extends "base.html" %}
{% block title %}Station PIN · {{ person.display_name }}{% endblock %}
{% block content %}
<nav class="page-back-nav"><a href="{% url 'station_home' %}">← Station</a></nav>
<section class="page-intro"><div><div class="eyebrow">ARENALINE STATION</div><h1>{{ person.display_name }}</h1><p>Enter your Station PIN.</p></div></section>
<section class="content-section people-form-shell">
  <form method="post" class="stacked-form">{% csrf_token %}{{ form.as_p }}<div class="actions"><button class="btn" type="submit">Continue</button><a class="btn btn-secondary" href="{% url 'station_home' %}">Cancel</a></div></form>
</section>
{% endblock %}
