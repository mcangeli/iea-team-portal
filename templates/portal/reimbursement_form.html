{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<nav class="page-back-nav"><a href="{% url 'reimbursement_list' %}">← Back to Reimbursements</a></nav>
<div class="form-card">
  <div class="eyebrow">{{ eyebrow }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">Save as a draft if you are still gathering details or receipts. Drafts stay private to you until submitted.</p>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="btn secondary" type="submit" name="action" value="draft">Save draft</button>
      <button class="btn" type="submit" name="action" value="submit">Submit for review</button>
    </div>
  </form>
</div>
{% endblock %}
