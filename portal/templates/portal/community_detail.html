{% extends "portal/base.html" %}
{% block content %}
<div class="container py-4">
  <a href="{% url 'community_feed' %}">← Back to Community</a>
  <article class="card mt-3"><div class="card-body">
    <h1>{{ post.title }}</h1>
    <p class="text-muted">{{ post.author.display_name }} · {{ post.published_at|date:"M j, Y" }}</p>
    <div style="white-space:pre-wrap">{{ post.body }}</div>
  </div></article>
</div>
{% endblock %}
